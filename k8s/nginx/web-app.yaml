# ------------------------------ DEPLOYMENT ------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web-app
  template:
    metadata:
      labels:
        app: nginx-web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-snippets
          mountPath: /etc/nginx/snippets/security-headers.conf
          subPath: security-headers.conf
        - name: tls-certs
          mountPath: /etc/nginx/certs
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-web-app-config
      - name: nginx-snippets
        configMap:
          name: nginx-snippets-config
      - name: tls-certs
        secret:
          secretName: nginx-tls
          # The Secret has keys `tls.crt` / `tls.key` (kubernetes.io/tls standard),
          # but nginx.conf references `selfsigned.crt` / `selfsigned.key` (matching
          # the file names used by docker-compose). Remap at mount time.
          items:
            - key: tls.crt
              path: selfsigned.crt
            - key: tls.key
              path: selfsigned.key

---

# ------------------------------ SERVICE ------------------------------
apiVersion: v1
kind: Service
metadata:
  name: nginx-web-app-service
spec:
  type: NodePort
  selector:
    app: nginx-web-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443
