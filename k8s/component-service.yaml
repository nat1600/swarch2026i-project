apiVersion: v1
kind: Service
metadata:
  name: component-service
  # Service Discovery: this name resolves inside the cluster as
  # component-service.default.svc.cluster.local
  # Internal Load Balancer: kube-proxy distributes requests across
  # all pods matching the selector, using round-robin.
spec:
  type: NodePort
  selector:
    app: reliability-component
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
