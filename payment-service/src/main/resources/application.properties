# Server Configuration
server.port=8005
server.servlet.context-path=/

# Spring Application
spring.application.name=payment-service

# Logging
logging.level.root=INFO
logging.level.com.arquisoft.payment=DEBUG

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payment_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MercadoPago Configuration
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-token=${MERCADOPAGO_WEBHOOK_TOKEN:}

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Actuator (optional, for monitoring)
management.endpoints.web.exposure.include=health,info
