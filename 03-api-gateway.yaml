apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: parla-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        # Non-sensitive config
        - name: PORT
          value: "8080"
        - name: ENVIRONMENT
          value: "development"
        
        # Service URLs (these are not really secret)
        - name: SERVICE_AUTH_URL
          value: "http://auth-service:8000"
        - name: SERVICE_CORE_URL
          value: "http://core-service:8000"
        - name: SERVICE_GAME_URL
          value: "http://gamification-service:8080"
        - name: SERVICE_FORUM_URL
          value: "http://forum-service:8001"
        - name: SERVICE_PAYMENT_URL
          value: "http://payment-service:8005"
        
        # Sensitive data from Secret
        - name: AUTH0_DOMAIN
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: AUTH0_DOMAIN
        - name: AUTH0_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: AUTH0_AUDIENCE
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: SLACK_WEBHOOK_URL
        
        # OR load ALL at once (easier):
        # envFrom:
        # - secretRef:
        #     name: api-gateway-secrets
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: parla-ns
spec:
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
