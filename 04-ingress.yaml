apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parla-ingress
  namespace: parla-ns
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: localhost
    http:
      paths:
      # Route API Gateway traffic
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      # Route direct to auth service (for testing)
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8000
